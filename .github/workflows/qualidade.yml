# Roda a cada envio (push) e em pull requests: confere segredos, testa o
# banco (permissões), o app (tipos, lint, formatação, testes e empacotamento)
# e as telas principais na versão web (e2e/).
name: Qualidade

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Verificar segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Procurar chaves, senhas e arquivos proibidos
        run: bash scripts/verificar-segredos.sh

  banco:
    name: Banco de dados (regras de acesso)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Testes de integração do banco (PGlite)
        run: npm test

  app:
    name: App (tipos, lint, testes, empacotamento)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-mobile
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos (TypeScript)
        run: npm run typecheck
      - name: Lint (ESLint)
        run: npm run lint
      - name: Formatação (Prettier)
        run: npm run format:check
      - name: Testes unitários (Jest)
        run: npm test -- --ci
      - name: Empacotar o JavaScript do app Android (garante que compila)
        run: npx expo export --platform android --output-dir dist-ci

  telas:
    name: Telas (versão web, ponta a ponta)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: 1
      # Chrome já vem instalado nas máquinas do GitHub; não precisa baixar outro navegador.
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            supabase/package-lock.json
            app-mobile/package-lock.json
            e2e/package-lock.json
      - name: Instalar dependências
        run: |
          npm ci --prefix supabase
          npm ci --prefix app-mobile
          npm ci --prefix e2e
      - name: Gerar a versão web do app
        working-directory: e2e
        run: npm run preparar
      - name: Testes de tela (login, calendário, evento, membros, convite, privacidade)
        working-directory: e2e
        run: npm test
      - name: Guardar as capturas de cada tela (aba Actions > esta execução > Artifacts)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: capturas-das-telas
          path: e2e/saida/
          retention-days: 14
