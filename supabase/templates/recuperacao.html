<h2>Redefinir senha</h2>
<p>Recebemos um pedido para redefinir a senha da sua conta na <strong>Agenda Compartilhada</strong>.</p>
<p>Digite este código no aplicativo:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 6px;">{{ .Token }}</p>
<p>O código vale por 1 hora. Se não foi você, ignore esta mensagem: sua senha continua a mesma.</p>
