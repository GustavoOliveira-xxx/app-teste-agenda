# Configuração do Supabase para desenvolvimento LOCAL (Supabase CLI + Docker).
# O projeto na nuvem é configurado pelo painel: veja GUIA_DE_DEPLOY.md.
project_id = "agenda-compartilhada"

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "agendacompartilhada://"
additional_redirect_urls = ["agendacompartilhada://**", "http://localhost:8081/**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# Em desenvolvimento local não há envio real de e-mail (o CLI mostra as
# mensagens no Inbucket). Ligue para testar o fluxo com código.
enable_confirmations = false

[auth.email.template.confirmation]
subject = "Seu código de confirmação"
content_path = "./supabase/templates/confirmacao.html"

[auth.email.template.recovery]
subject = "Código para redefinir sua senha"
content_path = "./supabase/templates/recuperacao.html"

# Entrar com Google (as chaves ficam no painel do Supabase, nunca aqui).
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

# Notificações pelo navegador: a função se autentica pelo segredo do agendamento.
[functions.enviar-push]
verify_jwt = false
